<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Racing Sim</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14161a; color: #ddd; font: 13px system-ui, sans-serif; overflow: hidden; }
      #bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; z-index: 2; flex-wrap: wrap; }
      button { background: #2a2f38; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 9px; cursor: pointer; font: inherit; }
      button.on { background: #3b6ea8; border-color: #4f86c6; }
      .grp { display: flex; gap: 2px; }
      .grp button { border-radius: 0; }
      .grp button:first-child { border-radius: 4px 0 0 4px; }
      .grp button:last-child { border-radius: 0 4px 4px 0; }
      #info { opacity: .75; }
      #c { display: block; width: 100vw; height: calc(100vh - 158px); }
      #tl { display: block; width: 100vw; height: 28px; border-top: 1px solid #2a2f38; cursor: pointer; touch-action: none; }
      #trace { display: block; width: 100vw; height: 130px; border-top: 1px solid #2a2f38; }
      .panel { position: fixed; background: rgba(20,22,26,.9); border: 1px solid #2a2f38; border-radius: 6px; padding: 6px 8px; z-index: 1; font-variant-numeric: tabular-nums; }
      #tower { top: calc(var(--bar, 36px) + 12px); left: 8px; width: 238px; max-height: calc(100vh - var(--bar, 36px) - 200px); overflow: auto; }
      #tower .hd { display: flex; justify-content: space-between; font-weight: 600; padding: 2px 2px 6px; border-bottom: 1px solid #2a2f38; margin-bottom: 3px; }
      .tr { display: grid; grid-template-columns: 22px 6px 1fr 64px; gap: 6px; align-items: center; padding: 2px; border-radius: 3px; cursor: pointer; }
      .tr:hover { background: #22262d; }
      .tr.sel { background: #2c3a4e; }
      .tr.bt { background: #242c37; box-shadow: inset 2px 0 #4f86c6; }
      .tr .sw { width: 6px; height: 14px; border-radius: 2px; }
      .tr .gap { text-align: right; opacity: .85; }
      .tr .p { text-align: right; opacity: .7; }
      .tr.fin .p::after { content: '🏁'; font-size: 9px; }
      #hud { top: calc(var(--bar, 36px) + 12px); right: 8px; min-width: 190px; }
      #hud .big { font-size: 22px; font-weight: 600; }
      #hud .row { display: flex; justify-content: space-between; gap: 16px; }
      #hud .lbl { opacity: .6; }
      #feed { right: 8px; bottom: 168px; width: 340px; max-height: 210px; overflow: auto; }
      #feed .hd { font-weight: 600; padding: 2px 2px 5px; border-bottom: 1px solid #2a2f38; margin-bottom: 3px; }
      .ev { display: grid; grid-template-columns: 64px 1fr; gap: 6px; padding: 2px; border-radius: 3px; cursor: pointer; }
      .ev:hover { background: #22262d; }
      .ev .tm { opacity: .55; white-space: nowrap; }
      .ev.pass .tx { color: #9fd18b; }
      .ev.mistake .tx { color: #e8c36a; }
      .ev.contact .tx { color: #ef7d6f; }
      .tr .tag { font-size: 9px; font-weight: 700; padding: 0 3px; border-radius: 2px; margin-left: 4px; vertical-align: 1px; }
      .tag.attack { background: #7a3b2e; }
      .tag.defend { background: #2e4f7a; }
      .tag.off { background: #3d5a2a; }
      .tag.spin { background: #8a6d12; }
      .tr.out { opacity: .5; }
      .tr.out .gap { color: #ff6b6b; opacity: 1; }
      .ev.off .tx, .ev.rejoin .tx { color: #a9c79a; }
      .ev.spin .tx { color: #ffb347; }
      .ev.crash .tx, .ev.retire .tx { color: #ff6b6b; font-weight: 600; }
      #tower .grip { color: #7cc8ff; font-weight: 600; }
      #tower .scb { background: #ffb000; color: #1a1400; font-weight: 700; text-align: center; border-radius: 3px; padding: 2px; margin: 0 0 4px; letter-spacing: .05em; }
      .ev.safety-car .tx { color: #ffb000; font-weight: 600; }
      .ev.grip .tx { color: #7cc8ff; font-weight: 600; }
      #editor { top: calc(var(--bar, 36px) + 8px); right: 8px; width: 400px; max-height: calc(100vh - var(--bar, 36px) - 24px); overflow: auto; z-index: 3; padding: 8px 10px; }
      #editor[hidden] { display: none; }
      #editor section { border-top: 1px solid #2a2f38; padding: 6px 0; }
      #editor h4 { margin: 2px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .8; }
      #editor h4 em, #editor .row em { font-style: normal; opacity: .55; text-transform: none; letter-spacing: 0; font-weight: 400; }
      #editor .row { display: grid; grid-template-columns: 110px 1fr auto; gap: 6px; align-items: center; margin: 3px 0; }
      #editor input, #editor select, #editor textarea { background: #1c2027; color: #ddd; border: 1px solid #3a404b; border-radius: 3px; padding: 3px 5px; font: inherit; min-width: 0; box-sizing: border-box; }
      #editor .row input[type=text], #editor .row input[type=number], #editor .row select, #editor .row textarea { width: 100%; }
      #editor input[type=checkbox] { justify-self: start; }
      #editor table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
      #editor th { font-weight: 400; opacity: .55; text-align: left; font-size: 11px; }
      #editor td { padding: 1px 2px 1px 0; }
      #editor td input, #editor td select { width: 100%; padding: 2px 3px; }
      #editor td input[type=color] { width: 22px; height: 22px; padding: 0; border: 0; background: none; }
      #editor .x { padding: 1px 5px; }
      #editor .bad { border-color: #ff6b6b; background: #3a1f22; }
      #editor .note { opacity: .7; margin: 4px 0; }
      #editor #ed-json { width: 100%; font: 11px ui-monospace, monospace; }
      #editor .ed-top { display: flex; gap: 4px; margin-bottom: 6px; }
      #editor .ed-top select { flex: 1; }
      .ed-msg { min-height: 0; margin-bottom: 4px; }
      .ed-msg.ok { color: #9fd18b; }
      .ed-msg.err { color: #ff6b6b; }
      .ed-errors { color: #ff9a8f; }
      .ed-errors div { margin: 2px 0; }
      .ed-run { position: sticky; bottom: -8px; background: rgba(20,22,26,.97); padding: 6px 0 2px; }
      button.primary { background: #2f7a46; border-color: #3d9a5a; width: 100%; padding: 6px; }
      button:disabled { opacity: .45; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="gen">New random track</button>
      <button id="draw">Draw track</button>
      <button id="close" hidden>Close loop</button>
      <button id="restart" title="Back to the start of this race (same seed: identical)">Replay</button>
      <button id="reseed" title="Same scenario, next seed">New seed</button>
      <button id="edit">Scenario</button>
      <span class="grp" id="speeds"></span>
      <button id="skip">+30 s</button>
      <button id="names" title="Driver names over the cars (n)">Names</button>
      <span class="grp"><button id="camAll" title="Whole track (o); wheel to zoom, drag to pan">Overview</button><button id="camFollow" title="Follow the selected car (f)">Follow</button><button id="camBattle" title="Frame the selected car and the cars racing it (b)">Battle</button></span>
      <span class="grp"><button id="zoomOut" title="Zoom out (−)">−</button><button id="zoomIn" title="Zoom in (+)">+</button></span>
      <span id="info"></span>
    </div>
    <div id="tower" class="panel"></div>
    <div id="hud" class="panel"></div>
    <div id="feed" class="panel"></div>
    <div id="editor" class="panel" hidden></div>
    <canvas id="c"></canvas>
    <canvas id="tl" title="Timeline: click or drag to rewind or skip ahead (← → keys)"></canvas>
    <canvas id="trace"></canvas>
    <script type="module" src="/src/view/main.ts"></script>
  </body>
</html>
