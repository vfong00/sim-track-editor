<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Racing Sim</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14161a; color: #ddd; font: 13px system-ui, sans-serif; overflow: hidden; }
      #bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; z-index: 2; flex-wrap: nowrap; pointer-events: none; }
      button { background: #2a2f38; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 9px; cursor: pointer; font: inherit; }
      button.on { background: #3b6ea8; border-color: #4f86c6; }
      .grp { display: flex; gap: 2px; }
      .grp button { border-radius: 0; }
      .grp button:first-child { border-radius: 4px 0 0 4px; }
      .grp button:last-child { border-radius: 0 4px 4px 0; }
      #info { pointer-events: none !important; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
      #bar > * { pointer-events: auto; }
      .menu { position: relative; }
      .menu .items { position: absolute; top: calc(100% + 4px); left: 0; min-width: 190px; display: flex; flex-direction: column; gap: 1px; padding: 4px; background: rgba(20,22,26,.97); border: 1px solid #2a2f38; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.4); z-index: 4; }
      .menu .items[hidden] { display: none; }
      .menu .items button { text-align: left; background: transparent; border-color: transparent; }
      .menu .items button:hover { background: #2a2f38; }
      .menu .items button.on { background: #2c3a4e; border-color: transparent; }
      .menu .items .sep { border-top: 1px solid #2a2f38; margin: 3px 2px; }
      #cam { left: 8px; bottom: 168px; display: flex; gap: 6px; align-items: center; padding: 4px; z-index: 2; }
      #mini { left: 8px; bottom: 206px; width: 200px; height: 150px; padding: 0; display: none; }
      body.mm #mini { display: block; }
      #tlbar { display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 0 0 4px; border-top: 1px solid #2a2f38; background: #181b20; }
      #tlbar button { padding: 1px 8px; }
      #tlbar #pause { width: 30px; padding: 1px 0; }
      #tlbar #pause.on { background: #7a5a1e; border-color: #a77b2a; }
      #tlbar select { background: #2a2f38; color: #ddd; border: 1px solid #444; border-radius: 4px; font: inherit; padding: 2px 2px; }
      #tower .hd .mode { cursor: pointer; padding: 0 5px; border-radius: 3px; background: #2a2f38; font-weight: 600; user-select: none; }
      #tower .hd .mode:hover { background: #3b6ea8; }
      #tower .hd .mode .dots { opacity: .5; font-size: 9px; margin-left: 3px; letter-spacing: 1px; }
      .tr .gap.purple { color: #c58cff; opacity: 1; font-weight: 600; }
      #tower.sec .tr { grid-template-columns: 32px 6px minmax(0, 1fr) 88px; }
      .tr .nm { display: flex; align-items: center; min-width: 0; white-space: nowrap; }
      .tr .nm .n { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .tr .nm .tag { flex-shrink: 0; }
      #tower.sec .tr .gap { display: flex; justify-content: flex-end; align-items: center; }
      .tr .chips { display: inline-flex; gap: 2px; margin-right: 5px; }
      .tr .sc { display: inline-block; width: 9px; height: 8px; border-radius: 1px; background: #3a3f48; }
      .sc.purple { background: #b06bff; } .sc.green { background: #3fbf5f; } .sc.yellow { background: #e0b400; }
      .tr .st { font-variant-numeric: tabular-nums; display: inline-block; width: 44px; text-align: right; }
      .st.purple, #hud .secs .purple { color: #c58cff; } .st.green, #hud .secs .green { color: #5fd47a; } .st.yellow, #hud .secs .yellow { color: #f0c419; }
      #hud .secs .sv { display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
      #hud .secs .none { opacity: .4; }
      #hud .dl { font-size: 11px; font-variant-numeric: tabular-nums; margin-left: 4px; }
      #hud .dl.ahead { color: #5fd47a; } #hud .dl.behind { color: #ff7a7a; }
      #hud { width: 250px; }
      #hud .st { margin-top: 6px; border-top: 1px solid #2a2f38; padding-top: 4px; font-size: 12px; }
      #hud .st .tg { cursor: pointer; user-select: none; display: flex; justify-content: space-between; opacity: .8; }
      #hud .st .tg:hover { opacity: 1; }
      #hud .st .prof { font-style: italic; margin: 3px 0 4px; color: #cfd5dd; }
      #hud .st .sub { opacity: .55; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; margin: 5px 0 1px; }
      #hud .st .sr { display: grid; grid-template-columns: 78px 1fr auto; gap: 6px; }
      #hud .st .sr .rk { opacity: .6; text-align: right; }
      #hud .st .sr .rk.top { color: #9fd18b; opacity: 1; }
      #c { display: block; width: 100vw; height: calc(100vh - 158px); }
      #tl { display: block; flex: 1; min-width: 0; height: 28px; cursor: pointer; touch-action: none; }
      #trace { display: block; width: 100vw; height: 130px; border-top: 1px solid #2a2f38; }
      .panel { position: fixed; background: rgba(20,22,26,.9); border: 1px solid #2a2f38; border-radius: 6px; padding: 6px 8px; z-index: 1; font-variant-numeric: tabular-nums; }
      #tower { top: calc(var(--bar, 36px) + 12px); left: 8px; width: 238px; max-height: calc(100vh - var(--bar, 36px) - 222px); overflow: auto; }
      body.mm #tower { max-height: calc(100vh - var(--bar, 36px) - 380px); }
      #tower .hd { display: flex; justify-content: space-between; font-weight: 600; padding: 2px 2px 6px; border-bottom: 1px solid #2a2f38; margin-bottom: 3px; }
      .tr { display: grid; grid-template-columns: 32px 6px minmax(0, 1fr) 64px; gap: 6px; align-items: center; padding: 2px; border-radius: 3px; cursor: pointer; }
      .tr:hover { background: #22262d; }
      .tr.sel { background: #2c3a4e; }
      .tr.bt { background: #242c37; box-shadow: inset 2px 0 #4f86c6; }
      .tr .sw { width: 6px; height: 14px; border-radius: 2px; }
      .tr .gap { text-align: right; opacity: .85; }
      /* Wide enough for "12🏁" on one line (it wrapped from P10 down). */
      .tr .p { text-align: right; opacity: .7; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .tr.fin .p::after { content: '🏁'; font-size: 9px; margin-left: 1px; }
      #hud { top: calc(var(--bar, 36px) + 12px); right: 8px; min-width: 190px; }
      #hud .big { font-size: 22px; font-weight: 600; }
      #hud .row { display: flex; justify-content: space-between; gap: 16px; }
      #hud .lbl { opacity: .6; }
      #feed { right: 8px; bottom: 168px; width: 340px; max-height: min(210px, calc(100vh - 168px - var(--hud, 300px) - 12px)); overflow: auto; }
      #feed .hd { font-weight: 600; padding: 2px 2px 5px; border-bottom: 1px solid #2a2f38; margin-bottom: 3px; }
      /* Wide enough for "L10 12:34.567" (digits are fixed-width), so long race times don't run under the text. */
      .ev { display: grid; grid-template-columns: 13ch 1fr; gap: 8px; padding: 2px; border-radius: 3px; cursor: pointer; }
      .ev:hover { background: #22262d; }
      .ev .tm { opacity: .55; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .ev.pass .tx { color: #9fd18b; }
      .ev.mistake .tx { color: #e8c36a; }
      .ev.contact .tx { color: #ef7d6f; }
      .tr .tag { font-size: 9px; font-weight: 700; padding: 0 3px; border-radius: 2px; margin-left: 4px; vertical-align: 1px; }
      .tag.attack { background: #7a3b2e; }
      .tag.defend { background: #2e4f7a; }
      .tag.off { background: #3d5a2a; }
      .tag.spin { background: #8a6d12; }
      .tr.out { opacity: .5; }
      .tr.out .gap { color: #ff6b6b; opacity: 1; }
      .ev.off .tx, .ev.rejoin .tx { color: #a9c79a; }
      .ev.spin .tx { color: #ffb347; }
      .ev.crash .tx, .ev.retire .tx { color: #ff6b6b; font-weight: 600; }
      .ev.cleared .tx { color: #9aa3ad; }
      #tower .grip { color: #7cc8ff; font-weight: 600; }
      #tower .scb { background: #ffb000; color: #1a1400; font-weight: 700; text-align: center; border-radius: 3px; padding: 2px; margin: 0 0 4px; letter-spacing: .05em; }
      .ev.safety-car .tx { color: #ffb000; font-weight: 600; }
      .ev.grip .tx { color: #7cc8ff; font-weight: 600; }
      #editor { top: calc(var(--bar, 36px) + 8px); right: 8px; width: 400px; max-height: calc(100vh - var(--bar, 36px) - 24px); overflow: auto; z-index: 3; padding: 8px 10px; }
      #editor[hidden] { display: none; }
      #editor section { border-top: 1px solid #2a2f38; padding: 6px 0; }
      #editor h4 { margin: 2px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .8; }
      #editor h4 em, #editor .row em { font-style: normal; opacity: .55; text-transform: none; letter-spacing: 0; font-weight: 400; }
      #editor .row { display: grid; grid-template-columns: 110px 1fr auto; gap: 6px; align-items: center; margin: 3px 0; }
      #editor input, #editor select, #editor textarea { background: #1c2027; color: #ddd; border: 1px solid #3a404b; border-radius: 3px; padding: 3px 5px; font: inherit; min-width: 0; box-sizing: border-box; }
      #editor .row input[type=text], #editor .row input[type=number], #editor .row select, #editor .row textarea { width: 100%; }
      #editor input[type=checkbox] { justify-self: start; }
      #editor table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
      #editor th { font-weight: 400; opacity: .55; text-align: left; font-size: 11px; }
      #editor td { padding: 1px 2px 1px 0; }
      #editor td input, #editor td select { width: 100%; padding: 2px 3px; }
      #editor td input[type=color] { width: 22px; height: 22px; padding: 0; border: 0; background: none; }
      #editor .x { padding: 1px 5px; }
      #editor .bad { border-color: #ff6b6b; background: #3a1f22; }
      #editor .note { opacity: .7; margin: 4px 0; }
      #editor #ed-json { width: 100%; font: 11px ui-monospace, monospace; }
      #editor .ed-top { display: flex; gap: 4px; margin-bottom: 6px; }
      #editor .ed-top select { flex: 1; min-width: 0; }
      #editor .ed-top button { flex: none; }
      #editor .ed-top .x { padding: 1px 8px; font-size: 14px; }
      .ed-msg { min-height: 0; margin-bottom: 4px; }
      .ed-msg.ok { color: #9fd18b; }
      .ed-msg.err { color: #ff6b6b; }
      .ed-errors { color: #ff9a8f; }
      .ed-errors div { margin: 2px 0; }
      .ed-run { position: sticky; bottom: -8px; background: rgba(20,22,26,.97); padding: 6px 0 2px; }
      button.primary { background: #2f7a46; border-color: #3d9a5a; width: 100%; padding: 6px; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      #summary, #quali { top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3; max-width: calc(100vw - 32px); max-height: calc(100vh - 200px); overflow: auto; padding: 8px 12px 10px; background: rgba(20,22,26,.96); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
      #summary[hidden], #quali[hidden] { display: none; }
      #summary .hd, #quali .hd { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-weight: 600; font-size: 14px; padding-bottom: 6px; border-bottom: 1px solid #2a2f38; }
      #summary .hd .x, #quali .hd .x { padding: 0 8px; font-size: 14px; }
      #summary .facts, #quali .facts { margin: 6px 0 8px; opacity: .85; line-height: 1.55; }
      #summary table, #quali table { border-collapse: collapse; width: 100%; }
      #summary th, #quali th { font-weight: 400; opacity: .55; font-size: 11px; text-align: left; padding: 0 6px 3px; }
      #summary td, #quali td { padding: 2px 6px; white-space: nowrap; }
      #summary .n, #quali .n { text-align: right; }
      #summary td.p, #quali td.p { text-align: right; opacity: .7; width: 2ch; }
      #summary td.car, #quali td.car { opacity: .7; }
      #summary tbody tr, #quali tbody tr { cursor: pointer; }
      #summary tbody tr:hover, #quali tbody tr:hover { background: #22262d; }
      #summary tr.out, #quali tr.out { opacity: .55; }
      #summary tr.out td:nth-last-child(4), #quali tr.out td:nth-last-child(3) { color: #ff6b6b; }
      #summary .sw, #quali .sw { display: inline-block; width: 6px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
      #summary .purple, #quali .purple { color: #c58cff; font-weight: 600; }
      #summary td.sec, #quali td.sec { font-size: 11px; opacity: .8; }
      #summary td.sec.purple, #quali td.sec.purple { opacity: 1; }
      #summary .up, #quali .up { color: #9fd18b; }
      #summary .dn, #quali .dn { color: #ef7d6f; }
      #summary .eq, #quali .eq { opacity: .4; }
    </style>
  </head>
  <body>
    <div id="bar">
      <div class="menu" id="raceMenu">
        <button id="raceBtn" aria-haspopup="menu" aria-expanded="false">Race ▾</button>
        <div class="items" id="raceItems" role="menu" hidden>
          <button id="gen" role="menuitem">New random track</button>
          <button id="draw" role="menuitem" title="Click points around the loop on the canvas">Draw track</button>
          <button id="edit" role="menuitem" title="Edit, open, save or share the scenario">Scenario…</button>
          <div class="sep"></div>
          <button id="reseed" role="menuitem" title="Same scenario, next seed">New seed</button>
          <button id="restart" role="menuitem" title="Back to the start of this race (same seed: identical) (Home)">Replay</button>
          <button id="result" role="menuitem" title="Classification, gaps, fastest laps, passes and incidents (r); available once the race is over">Result</button>
          <button id="qualiBtn" role="menuitem" title="Each car's qualifying run, and watch any of them (q)">Qualifying</button>
          <div class="sep"></div>
          <button id="curv" role="menuitem" title="Debug view: colour the track edges by curvature, green straight to red tight, instead of kerbs (k)">Curvature colours</button>
        </div>
      </div>
      <button id="close" hidden>Close loop</button>
      <button id="backRace" hidden title="Back to the race, where you left it">◀ Back to race</button>
      <span id="info"></span>
    </div>
    <div id="tower" class="panel"></div>
    <div id="hud" class="panel"><div id="hud-live"></div><div id="hud-stats"></div></div>
    <div id="feed" class="panel"></div>
    <canvas id="mini" class="panel" title="Whole track: every car, the followed one ringed"></canvas>
    <div id="cam" class="panel">
      <span class="grp"><button id="camAll" title="Whole track (o); wheel to zoom, drag to pan">Overview</button><button id="camFollow" title="Follow the selected car (f)">Follow</button><button id="camBattle" title="Frame the selected car and the cars racing it (b)">Battle</button></span>
      <span class="grp"><button id="zoomOut" title="Zoom out (−)">−</button><button id="zoomIn" title="Zoom in (+)">+</button></span>
      <button id="names" title="Driver names over the cars (n)">Names</button>
      <button id="inputs" title="Throttle and brake on the speed trace, worked out from the car's speed (i)">Inputs</button>
    </div>
    <div id="editor" class="panel" hidden></div>
    <div id="summary" class="panel" hidden></div>
    <div id="quali" class="panel" hidden></div>
    <canvas id="c"></canvas>
    <div id="tlbar">
      <button id="pause" title="Pause / play (space)">⏸</button>
      <select id="speed" title="Playback speed"></select>
      <button id="skip" title="Skip ahead 30 s (shift →)">+30 s</button>
      <canvas id="tl" title="Timeline: click or drag to rewind or skip ahead (← → keys)"></canvas>
    </div>
    <canvas id="trace"></canvas>
    <script type="module" src="/src/view/main.ts"></script>
  </body>
</html>
