<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Racing Sim</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14161a; color: #ddd; font: 13px system-ui, sans-serif; }
      #bar { position: fixed; top: 8px; left: 8px; display: flex; gap: 8px; align-items: center; z-index: 1; }
      button { background: #2a2f38; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
      button.on { background: #3b6ea8; }
      #info { opacity: .8; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="gen">New random track</button>
      <button id="draw">Draw track</button>
      <button id="close" hidden>Close loop</button>
      <span id="info"></span>
    </div>
    <canvas id="c"></canvas>
    <script type="module" src="/src/view/main.ts"></script>
  </body>
</html>
